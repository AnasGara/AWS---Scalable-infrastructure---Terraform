name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: terraform fmt -check -recursive
      - name: Validate bootstrap
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=bootstrap validate
          terraform -chdir=bootstrap test
      - name: Validate and test workload
        run: |
          terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra validate
          terraform -chdir=infra test
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/wait-for-refresh.sh infra/modules/service/user-data.sh.tftpl
      - run: bash tests/rollout.sh
