name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: terraform fmt -check -recursive
      - name: Validate bootstrap
        run: |
          terraform -chdir=bootstrap init -backend=false -input=false -lockfile=readonly
          terraform -chdir=bootstrap validate
          terraform -chdir=bootstrap test
      - name: Validate and test workload
        run: |
          terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infra validate
          terraform -chdir=infra test
      - run: python -m unittest discover -s tests -v
      - run: bash -n scripts/wait-for-refresh.sh infra/modules/service/user-data.sh.tftpl
      - run: bash tests/rollout.sh
